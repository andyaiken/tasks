# XcodeGen project definition. After changing this file, regenerate the
# Xcode project with:  xcodegen generate
name: Tasks

options:
  bundleIdPrefix: com.andyaiken
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"

packages:
  TasksCore:
    path: TasksCore

settings:
  base:
    DEVELOPMENT_TEAM: 3G846V4G68
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # Must match the version in App Store Connect. Bump the build number for every upload.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    SUPPORTS_MACCATALYST: NO
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_APPROACHABLE_CONCURRENCY: YES

targets:
  Tasks:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    # A saved, shared scheme, so Xcode always archives the app (with its widgets)
    # rather than picking one of the schemes it would otherwise invent per target.
    scheme: {}
    sources:
      - path: App
      - path: Shared
    info:
      path: Config/Info.plist
      properties:
        # CloudKit tells the app about changes from other devices with silent pushes.
        UIBackgroundModes: [remote-notification]
    dependencies:
      - package: TasksCore
      - target: TasksWidget
    settings:
      base:
        # The app's name, shown in the Mac menu bar and Finder. Identifiers keep the old "tasks".
        PRODUCT_NAME: Needs Doing
        PRODUCT_BUNDLE_IDENTIFIER: com.andyaiken.tasks
        # iPhone only; no iPad. This must be set per target: supportedDestinations
        # writes TARGETED_DEVICE_FAMILY = "1,2" on the target, which beats settings.base.
        TARGETED_DEVICE_FAMILY: "1"
        # Drawn by Tools/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/Tasks-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Tasks-macOS.entitlements
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Needs Doing
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # Portrait-only is fine because the app never runs side by side with others.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # No special encryption, so no export-compliance questions on each upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_PREVIEWS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  # The To do widget, for the iPhone home and Lock Screens and the Mac desktop.
  TasksWidget:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Config/Widget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: TasksCore
    settings:
      base:
        PRODUCT_NAME: TasksWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.andyaiken.tasks.widget
        # Must match the app; see the note on the Tasks target.
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Config/Widget-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Widget-macOS.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Needs Doing
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SKIP_INSTALL: YES
